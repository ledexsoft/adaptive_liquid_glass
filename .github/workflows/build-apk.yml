name: Build Example APK

# Compila la app de ejemplo (example/) en modo release y publica el APK
# como GitHub Release. Se dispara manualmente o al crear un tag "apk-*".

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build APK (release)
        working-directory: example
        run: flutter build apk --release

      - name: Preparar artefacto
        run: |
          mkdir -p dist
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             adaptive_liquid_glass-example.apk

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: App de ejemplo (APK) — run ${{ github.run_number }}
          body: |
            📱 **App de ejemplo de adaptive_liquid_glass**

            Demos interactivas de todos los widgets: botones Liquid Glass,
            barras nativas de iOS 26, alertas, pickers, snackbars y más.

            Descarga el APK abajo (`adaptive_liquid_glass-example.apk`) e
            instálalo en cualquier Android 6.0+.
          make_latest: true
          files: adaptive_liquid_glass-example.apk
