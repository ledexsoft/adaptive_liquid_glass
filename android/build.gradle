group 'com.ledexsoft.adaptive_liquid_glass'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        // Keep the Compose compiler plugin aligned with the Kotlin toolchain
        // required by Material 3 Expressive 1.5.
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.20'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.ledexsoft.adaptive_liquid_glass'
    compileSdk = 37

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-android:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-android:2.10.0'
    implementation 'androidx.savedstate:savedstate-android:1.4.0'
}

// AGP 9 built-in Kotlin; the Compose compiler plugin above enables Compose compilation.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
